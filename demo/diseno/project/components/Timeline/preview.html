<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0;padding:16px;background:var(--surface);max-width:480px}</style></head>
<body class="ob-root">

  </div>
  <div class="ob-timeline__read"><span>turno <strong>38</strong>/200</span><span>5 estallidos</span></div>
</div>
</body></html>
