<!-- @dsCard group="Narrativa" height=900 subtitle="Ocho pieles por estrategia, con insignia, y seis estados" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--surface); color: var(--ink); font: 400 15px/22px var(--font-sans); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h2 { margin: 0 0 var(--space-2); font: 600 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2:not(:first-child) { margin-top: var(--space-5); }
p.ob-help { margin: 0 0 var(--space-3); font-size: 13px; line-height: 19px; color: var(--muted); }
.ob-astro-rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
.ob-astro { display: grid; justify-items: center; gap: var(--space-1); margin: 0; padding: var(--space-3) var(--space-2); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); text-align: center; }
.ob-astro svg { display: block; }
.ob-astro__nombre { font-weight: 600; font-size: 14px; line-height: 20px; color: var(--ink); }
.ob-astro__insignia { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 13px; line-height: 19px; color: var(--muted); }
.ob-astro__estado { font-size: 13px; line-height: 19px; color: var(--muted); }
.ob-astro__estado strong { display: block; font-size: 14px; line-height: 20px; color: var(--ink); }
/* Arte de las pieles: los colores del traje, acento y visor llegan por variables --suit, --acc y --visor. */
.s { fill: var(--suit); } .a { fill: var(--acc); } .v { fill: var(--visor); }
.o { stroke: var(--line-strong); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.n { fill: none; }
.g { fill: none; stroke: #14182a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ref { fill: none; stroke: #14182a; stroke-width: 2.5; stroke-linecap: round; }
.grieta { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.burbuja { fill: var(--refuge); fill-opacity: 0.16; stroke: var(--refuge); stroke-width: 2; stroke-dasharray: 5 4; }
.pulso { fill: none; stroke: var(--share); stroke-width: 2; stroke-linecap: round; }
.pulso-punto { fill: var(--share); stroke: var(--line-strong); stroke-width: 1.5; }
.sonda { fill: var(--danger); stroke: var(--line-strong); stroke-width: 1.5; stroke-linejoin: round; }
</style></head>

<h2>Las ocho pieles</h2>
<p class="ob-help">La silueta cambia con la estrategia; el color del traje, el acento y el visor refuerzan, no sustituyen. Cada piel lleva su insignia en el pecho y su nombre debajo.</p>
<ul class="ob-astro-rejilla">
  <li><figure class="ob-astro" style="--suit:#eef3f8;--acc:#2f9bd6;--visor:#8fdcff">
    <svg viewBox="0 0 96 120" width="96" height="120" role="img" aria-labelledby="a1"><title id="a1">Astronauta cooperadora: casco redondo, brazos abiertos e insignia de ola</title><use href="#b-coop" width="96" height="120"/></svg>

  <li><figure class="ob-astro" style="--suit:#e6efe2;--acc:#3d9a5b;--visor:#a6e8b4">

    <figcaption><span class="ob-astro__nombre">Prudente</span>

  <li><figure class="ob-astro" style="--suit:#3b2a4d;--acc:#d98bb8;--visor:#f0b6dd">

  <li><figure class="ob-astro" style="--suit:#e7d7b8;--acc:#c2813a;--visor:#ffd9a0">
    <svg viewBox="0 0 96 120" width="96" height="120" role="img" aria-labelledby="a5"><title id="a5">Astronauta solitaria: figura pequeña con sombrero de ala y farol, insignia de duna</title><use href="#b-sol" width="96" height="120"/></svg>
    <figcaption><span class="ob-astro__nombre">Solitaria</span>

<h2>Estados</h2>

    <svg viewBox="-4 -14 104 136" width="104" height="136" role="img" aria-labelledby="s5"><title id="s5">Astronauta que miente: reflejo de espejo en el visor</title><use href="#b-coop" width="96" height="120"/><use href="#e-miente" width="104" height="136" x="-4" y="-14"/></svg>
    <figcaption class="ob-astro__estado"><strong>Miente</strong>Reflejo en el visor</figcaption></figure></li>
  <li><figure class="ob-astro" style="--suit:#eef3f8;--acc:#2f9bd6;--visor:#8fdcff">
