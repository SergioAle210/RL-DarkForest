# Currículo, etapa 1: letalidad alta donde cooperar domina; población mixta.
extends: base.yaml
env:
  n_civs: 2
  detection_growth: 0.05
  anomaly:
    lethality: 1.0
    radius: 0.45
train:
  n_envs: 1024
  rollout_len: 64
  total_steps: 5_242_880
  num_minibatches: 8
  update_epochs: 4
  reward_scale: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.005
  max_grad_norm: 1.0
  save_snapshots: true
  self_play:
    rho: 0.6
    snapshot_every: 5
    max_snapshots: 20
    w_snapshot: 0.4
    w_recip: 0.3
    w_coop_real: 0.1
    w_ataque_solo: 0.1
    w_solo: 0.05
    w_ignorar: 0.05
