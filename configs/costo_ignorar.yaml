extends: base.yaml
env:
  n_civs: 2
  detection_growth: 0.05
  anomaly:
    lethality: 0.5
    radius: 0.45
train:
  n_envs: 1024
  rollout_len: 64
  total_steps: 2097152
  self_play:
    rho: 0.0
